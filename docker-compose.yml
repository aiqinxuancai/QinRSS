services:
  qinrss:
    image: ghcr.io/aiqinxuancai/qinrss:latest
    container_name: qinrss
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "1868:1868"
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
